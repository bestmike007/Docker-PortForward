name: "Docker Build & Push to GHCR"

on:
  push:
    branches:
      - build/alpine-latest
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build_push:
    name: "Docker Build & Push"
    if: github.repository == 'bestmike007/Docker-PortForward'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: "Docker metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bestmike007/docker-portforward
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/bestmike007/Docker-PortForward
      - name: "Build and push"
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
